<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>노른자 받기 — 김유란 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap">
<style>
/* 김유란 포트폴리오와 같은 무드: 흰 바탕 · 차콜 #333 · Pretendard + Orbitron · 작은 모서리 · 노른자 포인트 */
:root { --ink: #333; --sub: #777; --mute: #999; --line: #ECECEC; --soft: #F7F7F7; --yolk: #FFC21A; --yolk-l: #FFE58F; --en: "Orbitron", "Pretendard Variable", Pretendard, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: #fff; color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; letter-spacing: -0.01em; }
body.playing { touch-action: none; user-select: none; -webkit-user-select: none; }
.en { font-family: var(--en); letter-spacing: .08em; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* 상단 바 — 포트폴리오 GNB와 같은 구성 */
.bar { position: fixed; left: 0; right: 0; top: 0; z-index: 8; height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 8.334vw, 160px); background: rgba(255,255,255,.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid #F0F0F0; }
.bar__logo { color: var(--ink); text-decoration: none; font-size: 18px; font-weight: 700; }
.bar__logo small { margin-left: 8px; font-family: var(--en); font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--mute); }
.bar__back { color: var(--sub); text-decoration: none; font-size: 15px; }
.bar__back:hover { color: var(--ink); }

/* HUD */
.hud { position: fixed; left: 0; right: 0; top: 76px; z-index: 6; display: flex; justify-content: space-between; align-items: flex-start; padding: 22px clamp(20px, 8.334vw, 160px) 0; pointer-events: none; }
.hud[hidden], .scr[hidden], .gate[hidden], .loader[hidden] { display: none; }
.hud__lb { font-family: var(--en); font-size: 12px; letter-spacing: .16em; color: var(--mute); }
.hud__score { margin-top: 6px; font-family: var(--en); font-size: 41px; font-weight: 700; line-height: 1; }
.hud__combo { margin-top: 8px; min-height: 20px; font-family: var(--en); font-size: 13px; letter-spacing: .1em; color: #B88A00; }
.hud__right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: auto; }
.lives { display: flex; gap: 8px; }
.lives i { width: 14px; height: 14px; border-radius: 50%; background: var(--yolk-l); box-shadow: inset 0 -1px 1.5px rgba(214,160,0,.35); transition: .3s; }
.lives i.off { background: #fff; box-shadow: inset 0 0 0 1.5px #D9D9D9; }
.pbtn { height: 32px; padding: 0 12px; border: 1px solid #E3E3E3; border-radius: 4px; background: #fff; color: var(--sub); font-family: var(--en); font-size: 12px; letter-spacing: .12em; cursor: pointer; }
.pbtn:hover { border-color: #CFCFCF; color: var(--ink); }

/* 화면 카드 */
.scr { position: fixed; inset: 76px 0 0; z-index: 7; display: grid; place-items: center; padding: 20px; }
.card { width: min(440px, 100%); padding: 36px 32px 30px; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 24px 60px -28px rgba(0,0,0,.18); text-align: center; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.pill { display: inline-block; padding: 6px 12px; border: 1px solid #E3E3E3; border-radius: 99px; font-size: 13px; color: var(--sub); }
.card h1 { margin-top: 14px; font-size: 35px; font-weight: 700; letter-spacing: -0.04em; }
.card .en-t { margin-top: 6px; font-family: var(--en); font-size: 14px; letter-spacing: .2em; color: var(--mute); }
.card .lead { margin-top: 14px; font-size: 16px; line-height: 1.65; color: var(--sub); }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; border-top: 1px solid var(--ink); }
.rules div { padding: 16px 6px 14px; font-size: 14px; line-height: 1.45; color: var(--sub); border-bottom: 1px solid #F0F0F0; }
.rules div + div { border-left: 1px solid #F0F0F0; }
.rules b { display: block; margin-bottom: 4px; color: var(--ink); font-weight: 700; font-size: 15px; }
.rules canvas { position: static; width: 34px; height: 34px; margin: 0 auto 8px; }
.btn { width: 100%; height: 54px; margin-top: 22px; border: 0; border-radius: 6px; background: var(--ink); color: #fff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; transition: background .2s; }
.btn:hover { background: #444; }
.btn--line { height: 48px; margin-top: 10px; border: 1px solid #E3E3E3; background: #fff; color: var(--ink); font-weight: 500; }
.btn--line:hover { background: var(--soft); }
.hint { margin-top: 14px; font-size: 14px; color: var(--mute); }
.best { margin-top: 10px; font-size: 14px; color: var(--sub); }
.final { margin-top: 12px; font-family: var(--en); font-size: 73px; font-weight: 800; line-height: 1; }
.rank { margin-top: 10px; font-size: 19px; font-weight: 700; }
.newbest { display: inline-block; margin-top: 10px; padding: 5px 12px; border-radius: 99px; background: #FFF6D6; color: #8A6400; font-size: 13px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; border-top: 1px solid var(--ink); }
.stats div { padding: 12px 4px; border-bottom: 1px solid #F0F0F0; }
.stats div + div { border-left: 1px solid #F0F0F0; }
.stats small { display: block; font-family: var(--en); font-size: 11px; letter-spacing: .14em; color: var(--mute); }
.stats b { display: block; margin-top: 6px; font-family: var(--en); font-size: 19px; }

/* 비밀번호 · 로더 — 포트폴리오와 같은 모양 */
.gate { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: #fff; }
.gate .card { width: min(400px, 100%); }
.pin { position: relative; display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
.pin span { width: 52px; height: 60px; display: grid; place-items: center; border: 1px solid #E3E3E3; border-radius: 6px; font-size: 19px; transition: border-color .2s; }
.pin span.on { border-color: var(--ink); } .pin span.cur { border-color: var(--mute); }
.pin input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 17px; caret-color: transparent; }
.pin.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.err { min-height: 22px; margin-top: 12px; font-size: 15px; color: #C23333; }
.loader { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; gap: 22px; align-items: center; justify-content: center; background: #fff; }
.loader p { font-size: 14px; color: #999; }
.loader.done { opacity: 0; visibility: hidden; }
.dots { display: flex; gap: 12px; align-items: flex-end; height: 40px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--yolk-l); box-shadow: inset 0 -1px 1.5px rgba(214,160,0,.25); animation: hop 1.2s cubic-bezier(.3,1.6,.5,1) infinite; }
.dots i:nth-child(2) { animation-delay: .12s; } .dots i:nth-child(3) { animation-delay: .24s; } .dots i:nth-child(4) { animation-delay: .36s; } .dots i:nth-child(5) { animation-delay: .48s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-18px); } }
.toast { position: fixed; left: 50%; bottom: 36px; z-index: 40; transform: translate(-50%, 12px); padding: 12px 18px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 15px; opacity: 0; transition: .3s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 600px) { .bar { height: 64px; } .hud { top: 64px; } .scr { inset: 64px 0 0; } .card { padding: 28px 22px 24px; } .card h1 { font-size: 29px; } .final { font-size: 61px; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; } .card { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<header class="bar">
  <a class="bar__logo" href="../index.html">김유란<small>PLAYGROUND</small></a>
  <a class="bar__back" href="../index.html">포트폴리오로 돌아가기 →</a>
</header>

<div class="hud" id="hud" hidden>
  <div><p class="hud__lb">SCORE</p><p class="hud__score" id="score">0</p><p class="hud__combo" id="combo"></p></div>
  <div class="hud__right"><div class="lives" id="lives" aria-label="남은 기회"><i></i><i></i><i></i></div><button class="pbtn" id="pauseBtn" type="button">PAUSE</button></div>
</div>

<section class="scr" id="start" hidden>
  <div class="card">
    <span class="pill">미니게임</span>
    <h1>노른자 받기</h1>
    <p class="en-t">YOLK CATCH</p>
    <p class="lead">위에서 떨어지는 노른자를 팬으로 받아 주세요.<br>세 번 놓치면 끝나요.</p>
    <div class="rules">
      <div><canvas width="68" height="68" data-ico="y"></canvas><b>노른자</b>+1점</div>
      <div><canvas width="68" height="68" data-ico="g"></canvas><b>반짝 노른자</b>+5점</div>
      <div><canvas width="68" height="68" data-ico="b"></canvas><b>탄 달걀</b>받으면 안 돼요</div>
    </div>
    <button class="btn" id="go" type="button">시작하기</button>
    <p class="best" id="bestStart"></p>
    <p class="hint">마우스 · 손가락으로 팬을 움직여요 · 키보드 ← →</p>
  </div>
</section>

<section class="scr" id="over" hidden>
  <div class="card">
    <span class="pill">GAME OVER</span>
    <p class="final" id="final">0</p>
    <p class="rank" id="rank"></p>
    <p id="nb" hidden><span class="newbest">최고 기록을 새로 세웠어요</span></p>
    <div class="stats"><div><small>CATCH</small><b id="stCatch">0</b></div><div><small>MAX COMBO</small><b id="stCombo">0</b></div><div><small>BEST</small><b id="stBest">0</b></div></div>
    <button class="btn" id="again" type="button">한 판 더</button>
    <button class="btn btn--line" id="share" type="button">친구에게 점수 보내기</button>
  </div>
</section>

<div class="gate" id="gate" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="g-t">
    <p class="en-t" style="margin-top:0">PLAYGROUND</p>
    <h1 id="g-t" style="font-size:24px;margin-top:10px">지인 전용 놀이터</h1>
    <p class="lead" style="margin-top:8px">비밀번호 네 자리를 입력하면 들어갈 수 있어요.</p>
    <form id="gform" novalidate>
      <div class="pin" id="pin"><span></span><span></span><span></span><span></span><input id="pinIn" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="비밀번호 네 자리"></div>
      <p class="err" id="gerr" role="alert"></p>
      <button type="submit" class="btn" style="margin-top:6px">입장하기</button>
    </form>
  </div>
</div>

<div class="loader" id="loader" role="status" aria-label="불러오는 중" hidden><div class="dots"><i></i><i></i><i></i><i></i><i></i></div><p>김유란의 놀이터</p></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 입장: 비밀번호 → 로딩 → 놀이터 ---------- */
  var HASH = 'd2967f9c27227eca434ed735fbdee3743864f8578e9204429c351bab91a67b2f';
  function sha(t) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function (b) { return [].map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }); }
  function enter(withLoader) {
    $('gate').hidden = true;
    if (!withLoader) { $('start').hidden = false; return; }
    var ld = $('loader'); ld.hidden = false; ld.classList.remove('done');
    setTimeout(function () { ld.hidden = true; $('start').hidden = false; }, 1500);
  }
  var ok = false; try { ok = sessionStorage.getItem('yolk-play') === '1'; } catch (e) {}
  if (ok) enter(true);
  else {
    $('gate').hidden = false;
    var inp = $('pinIn'), boxes = $('pin').querySelectorAll('span');
    var paint = function () { var v = inp.value; [].forEach.call(boxes, function (b, i) { b.textContent = v[i] ? '●' : ''; b.classList.toggle('on', !!v[i]); b.classList.toggle('cur', i === v.length); }); };
    var check = function () {
      if (inp.value.length < 4) { $('gerr').textContent = '네 자리를 모두 입력해 주세요.'; return; }
      sha('yolk-play:' + inp.value).then(function (h) {
        if (h !== HASH) { $('gerr').textContent = '비밀번호가 달라요. 다시 입력해 주세요.'; var p = $('pin'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); inp.value = ''; paint(); inp.focus(); return; }
        try { sessionStorage.setItem('yolk-play', '1'); } catch (e) {}
        enter(true);
      });
    };
    inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, '').slice(0, 4); $('gerr').textContent = ''; paint(); if (inp.value.length === 4) check(); });
    $('gform').addEventListener('submit', function (e) { e.preventDefault(); check(); });
    paint(); setTimeout(function () { inp.focus(); }, 50);
  }

  /* ---------- 캔버스 ---------- */
  var cv = $('c'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  resize(); addEventListener('resize', resize);
  var TOP = function () { return W <= 600 ? 64 : 76; };

  /* 그림 — 포트폴리오 노른자 봇과 같은 노른자 */
  function egg(c, x, y, r, type, wob, rot) {
    c.save(); c.translate(x, y);
    if (type === 'b') {
      c.rotate(rot || 0);
      c.fillStyle = '#333'; c.beginPath(); c.ellipse(0, 0, r * 0.82, r, 0, 0, 7); c.fill();
      c.strokeStyle = '#777'; c.lineWidth = Math.max(1.5, r * 0.08); c.lineJoin = 'round'; c.beginPath();
      c.moveTo(-r * 0.55, -r * 0.05); c.lineTo(-r * 0.25, r * 0.15); c.lineTo(0, -r * 0.1); c.lineTo(r * 0.25, r * 0.15); c.lineTo(r * 0.55, -r * 0.05); c.stroke();
      c.restore(); return;
    }
    var sq = 1 + Math.sin(wob || 0) * 0.05; c.scale(sq, 2 - sq);
    c.fillStyle = '#fff'; c.shadowColor = 'rgba(0,0,0,.10)'; c.shadowBlur = r * 0.5; c.shadowOffsetY = r * 0.15;
    c.beginPath(); c.arc(0, 0, r * 1.38, 0, 7); c.fill();
    c.shadowColor = 'transparent';
    c.strokeStyle = '#ECECEC'; c.lineWidth = 1; c.stroke();
    var g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#FFF0B0'); g.addColorStop(0.55, type === 'g' ? '#FFC21A' : '#FFD54A'); g.addColorStop(1, type === 'g' ? '#F2A100' : '#F5B400');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 0.82, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.ellipse(-r * 0.28, -r * 0.32, r * 0.2, r * 0.12, -0.6, 0, 7); c.fill();
    if (type === 'g') { c.strokeStyle = '#FFC21A'; c.lineWidth = Math.max(1.5, r * 0.07); c.setLineDash([r * 0.18, r * 0.22]); c.lineDashOffset = -(wob || 0) * 3; c.beginPath(); c.arc(0, 0, r * 1.62, 0, 7); c.stroke(); c.setLineDash([]); }
    c.restore();
  }
  [].forEach.call(document.querySelectorAll('[data-ico]'), function (el) { var c = el.getContext('2d'); egg(c, 34, 34, el.dataset.ico === 'b' ? 22 : 17, el.dataset.ico, 0, 0.3); });

  /* ---------- 상태 ---------- */
  var best = 0; try { best = +localStorage.getItem('yolk-catch-best') || 0; } catch (e) {}
  function showBest() { $('bestStart').textContent = best ? '내 최고 기록 ' + best + '점' : ''; }
  showBest();
  var S = 'start', score = 0, lives = 3, combo = 0, maxCombo = 0, caught = 0, t = 0, spawnT = 0, shake = 0, paused = false;
  var items = [], parts = [], floats = [], keys = {};
  var pan = { x: 0, tx: 0, w: 130, tilt: 0, squash: 0 };

  addEventListener('pointermove', function (e) { pan.tx = e.clientX; });
  addEventListener('pointerdown', function (e) { if (S === 'play') pan.tx = e.clientX; });
  addEventListener('keydown', function (e) { keys[e.key] = true; if (e.key === ' ' && S === 'play') { e.preventDefault(); togglePause(); } });
  addEventListener('keyup', function (e) { keys[e.key] = false; });

  function start() {
    S = 'play'; score = 0; lives = 3; combo = 0; maxCombo = 0; caught = 0; t = 0; spawnT = 0.8; items = []; floats = []; parts = []; paused = false;
    pan.w = Math.max(110, Math.min(150, W * 0.14)); pan.x = pan.tx = W / 2;
    $('start').hidden = true; $('over').hidden = true; $('hud').hidden = false; $('pauseBtn').textContent = 'PAUSE';
    document.body.classList.add('playing'); hud();
  }
  function end() {
    S = 'over'; document.body.classList.remove('playing');
    var nb = score > best; if (nb) { best = score; try { localStorage.setItem('yolk-catch-best', best); } catch (e) {} }
    $('final').textContent = score; $('nb').hidden = !nb;
    $('rank').textContent = score >= 150 ? '노른자 장인이에요' : score >= 80 ? '팬 다루는 솜씨가 좋아요' : score >= 40 ? '반숙 정도는 거뜬해요' : score >= 15 ? '이제 막 손에 익었어요' : '노른자가 많이 터졌어요';
    $('stCatch').textContent = caught; $('stCombo').textContent = maxCombo; $('stBest').textContent = best;
    setTimeout(function () { $('hud').hidden = true; $('over').hidden = false; }, 700);
    showBest();
  }
  function togglePause() { if (S !== 'play') return; paused = !paused; $('pauseBtn').textContent = paused ? 'RESUME' : 'PAUSE'; }
  $('go').onclick = start; $('again').onclick = start; $('pauseBtn').onclick = togglePause;
  $('share').onclick = function () {
    var url = location.origin + location.pathname.replace(/play\/.*$/, '');
    var txt = '김유란 놀이터 ‘노른자 받기’에서 ' + score + '점 받았어! 이겨 볼래? (비밀번호는 나한테 물어봐)';
    if (navigator.share) navigator.share({ title: '노른자 받기', text: txt, url: url }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt + '\n' + url).then(function () { toast('메시지를 복사했어요. 친구에게 붙여넣어 보내 주세요.'); }, function () { toast(url); });
  };
  function toast(m) { var e = $('toast'); e.textContent = m; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('on'); }, 2200); }
  function mult() { return combo >= 15 ? 4 : combo >= 8 ? 3 : combo >= 3 ? 2 : 1; }
  function hud() {
    $('score').textContent = score;
    $('combo').textContent = combo >= 3 ? combo + ' COMBO  ×' + mult() : '';
    [].forEach.call($('lives').children, function (el, i) { el.classList.toggle('off', i >= lives); });
  }
  function level() { return Math.min(1, t / 75); }
  function spawn() {
    var lv = level(), r = Math.random(), type = 'y';
    if (r < 0.07 + lv * 0.03) type = 'g'; else if (r < 0.24 + lv * 0.16) type = 'b';
    var size = type === 'b' ? 20 + Math.random() * 4 : 17 + Math.random() * 3;
    items.push({ type: type, x: 40 + Math.random() * (W - 80), y: TOP() - 20, vx: (Math.random() - 0.5) * (40 + lv * 110), vy: 110 + Math.random() * 60 + lv * 250, r: size, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 4, wob: Math.random() * 6 });
  }
  function burst(x, y, n, cols, sp) { for (var i = 0; i < n; i++) { var a = Math.random() * Math.PI * 2, s = (sp || 240) * (0.3 + Math.random()); parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, r: 2.5 + Math.random() * 4.5, life: 1, c: cols[i % cols.length] }); } }
  function flo(x, y, txt, col) { floats.push({ x: x, y: y, txt: txt, c: col || '#333', life: 1 }); }

  function step(dt) {
    t += dt;
    var kd = (keys.ArrowLeft || keys.a ? -1 : 0) + (keys.ArrowRight || keys.d ? 1 : 0);
    if (kd) pan.tx = Math.max(0, Math.min(W, pan.tx + kd * 900 * dt));
    var px = pan.x; pan.x += (pan.tx - pan.x) * Math.min(1, dt * 18);
    pan.tilt += (((pan.x - px) / Math.max(dt, 0.001)) * 0.0005 - pan.tilt) * Math.min(1, dt * 10);
    pan.tilt = Math.max(-0.12, Math.min(0.12, pan.tilt)); pan.squash *= Math.pow(0.02, dt);
    spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(0.3, 0.95 - level() * 0.6) * (0.7 + Math.random() * 0.6); }
    var py = H - 96;
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i]; it.vy += 150 * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt; it.wob += dt * 8;
      var R = it.type === 'b' ? it.r : it.r * 1.38;
      if (it.x < R || it.x > W - R) { it.vx *= -1; it.x = Math.max(R, Math.min(W - R, it.x)); }
      if (it.vy > 0 && it.y + R > py - 6 && it.y - R < py + 12 && Math.abs(it.x - pan.x) < pan.w / 2 + R * 0.4) {
        items.splice(i, 1); pan.squash = 1;
        if (it.type === 'b') { lives--; combo = 0; shake = 10; burst(it.x, py, 14, ['#333', '#777', '#BBB'], 260); flo(it.x, py - 34, '탄 달걀!', '#C23333'); hud(); if (lives <= 0) return end(); }
        else { combo++; maxCombo = Math.max(maxCombo, combo); caught++; var g = (it.type === 'g' ? 5 : 1) * mult(); score += g;
          burst(it.x, py - 10, it.type === 'g' ? 20 : 10, ['#FFC21A', '#FFE58F', '#FFFFFF', '#ECECEC']);
          flo(it.x, py - 40, '+' + g, it.type === 'g' ? '#B88A00' : '#333');
          if (combo === 3 || combo === 8 || combo === 15) flo(W / 2, H * 0.38, combo === 15 ? 'COMBO ×4' : combo === 8 ? 'COMBO ×3' : 'COMBO ×2', '#B88A00');
          hud(); }
        continue;
      }
      if (it.y - R > H) { items.splice(i, 1); if (it.type !== 'b') { combo = 0; lives--; shake = 8; burst(it.x, H - 4, 12, ['#FFC21A', '#FFE58F'], 200); flo(it.x, H - 60, '놓쳤어요', '#C23333'); hud(); if (lives <= 0) return end(); } }
    }
  }

  function drawBg() {
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H);
    // 포트폴리오 본문처럼 은은한 세로 기준선
    var gut = W <= 600 ? 20 : Math.min(160, W * 0.08334);
    cx.strokeStyle = '#F4F4F4'; cx.lineWidth = 1;
    for (var k = 0; k <= 4; k++) { var x = Math.round(gut + (W - gut * 2) * k / 4) + 0.5; cx.beginPath(); cx.moveTo(x, TOP()); cx.lineTo(x, H); cx.stroke(); }
    cx.strokeStyle = '#ECECEC'; cx.beginPath(); cx.moveTo(0, H - 40.5); cx.lineTo(W, H - 40.5); cx.stroke();
  }
  function drawPan() {
    var y = H - 96, w = pan.w, s = pan.squash;
    cx.save(); cx.translate(pan.x, y); cx.rotate(pan.tilt);
    cx.fillStyle = 'rgba(0,0,0,.06)'; cx.beginPath(); cx.ellipse(0, 56, w * 0.5, 6, 0, 0, 7); cx.fill();
    cx.fillStyle = '#333'; cx.beginPath(); if (cx.roundRect) cx.roundRect(w / 2, -2, w * 0.5, 10, 4); else cx.rect(w / 2, -2, w * 0.5, 10); cx.fill();
    cx.scale(1 + s * 0.1, 1 - s * 0.18);
    cx.fillStyle = '#333'; cx.beginPath(); cx.ellipse(0, 3, w / 2 + 4, 16, 0, 0, Math.PI); cx.fill();
    cx.fillStyle = '#4A4A4A'; cx.beginPath(); cx.ellipse(0, 0, w / 2 + 4, 10, 0, 0, 7); cx.fill();
    cx.fillStyle = '#2A2A2A'; cx.beginPath(); cx.ellipse(0, 0, w / 2 - 4, 6.5, 0, 0, 7); cx.fill();
    cx.restore();
  }

  var idle = [];
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (S === 'play' && !paused) step(dt);
    cx.save();
    if (shake > 0) { cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= Math.pow(0.002, dt); if (shake < 0.3) shake = 0; }
    drawBg();
    if (S !== 'play') {
      if (Math.random() < dt * 1.6) idle.push({ type: Math.random() < 0.15 ? 'g' : 'y', x: Math.random() * W, y: TOP() - 20, vy: 50 + Math.random() * 50, r: 10 + Math.random() * 10, wob: Math.random() * 6 });
      idle.forEach(function (it) { it.y += it.vy * dt; it.wob += dt * 3; cx.globalAlpha = 0.55; egg(cx, it.x, it.y, it.r, it.type, it.wob); cx.globalAlpha = 1; });
      idle = idle.filter(function (it) { return it.y < H + 40; });
    }
    if (S === 'play' || S === 'over') items.forEach(function (it) { egg(cx, it.x, it.y, it.r, it.type, it.wob, it.rot); });
    if (S === 'play' || S === 'over') drawPan();
    for (var i = parts.length - 1; i >= 0; i--) { var p = parts[i]; p.vy += 650 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.5; if (p.life <= 0) { parts.splice(i, 1); continue; } cx.globalAlpha = p.life; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r * p.life, 0, 7); cx.fill(); }
    cx.globalAlpha = 1; cx.textAlign = 'center';
    for (var j = floats.length - 1; j >= 0; j--) { var f = floats[j]; f.life -= dt * 1.3; f.y -= 46 * dt; if (f.life <= 0) { floats.splice(j, 1); continue; } cx.globalAlpha = Math.min(1, f.life * 2); cx.fillStyle = f.c; cx.font = (/COMBO|\+/.test(f.txt) ? '700 22px Orbitron, ' : '700 18px ') + '"Pretendard Variable", Pretendard, sans-serif'; cx.fillText(f.txt, f.x, f.y); }
    cx.globalAlpha = 1;
    if (paused) { cx.fillStyle = 'rgba(255,255,255,.75)'; cx.fillRect(0, 0, W, H); cx.fillStyle = '#333'; cx.font = '700 26px "Pretendard Variable", Pretendard, sans-serif'; cx.fillText('잠시 멈춤', W / 2, H / 2); cx.font = '400 15px "Pretendard Variable", Pretendard, sans-serif'; cx.fillStyle = '#777'; cx.fillText('RESUME을 누르거나 스페이스바를 누르면 계속돼요', W / 2, H / 2 + 30); }
    cx.restore();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', function () { if (document.hidden && S === 'play' && !paused) togglePause(); });
})();
</script>
